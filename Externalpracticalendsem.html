<!DOCTYPE html>
<html>
<head><title>ARMSTRONG NUMBER</title></head>
<body>
    <h2>ARMSTRONG NUMBER CHECKER</h2> 
    <label>Enter a 3-digit number: </label>
    <input type="number" id="numInput">
    <button onclick="armstrong()">Check</button>
    <p id="result"></p>
    <script>
       function armstrong() {
          let num = parseInt(document.getElementById("numInput").value);
          let temp = num;
          let sum = 0;
          while (temp > 0) {
              let digit = temp % 10;
              sum += digit * digit * digit; 
              temp = parseInt(temp / 10);   
          }
          if (sum === num)
              document.getElementById("result").innerHTML = num + " is Armstrong ";
          else
              document.getElementById("result").innerHTML = num + " is Not Armstrong ";
       }
    </script>
</body>
</html>
